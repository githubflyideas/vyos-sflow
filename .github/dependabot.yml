# Weekly pull requests for outdated Go modules (DuckDB's bindings among them)
# and GitHub Actions; security fixes are proposed as soon as they are known.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    ignore:
      # DuckDB 2.0's prebuilt library needs AVX2 (Haswell or newer) and
      # stops with "illegal instruction" on routers without it. Stay on 1.5
      # until a release runs on any x86-64 CPU (tests/baseline-cpu.sh).
      - dependency-name: github.com/duckdb/duckdb-go/v2
        versions: [">= 2.20000.0"]
      - dependency-name: github.com/duckdb/duckdb-go-bindings
        versions: [">= 0.20000.0"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
