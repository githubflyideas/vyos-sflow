name: linux-ci
on:
  push:
    branches: [main, 'feat/**', 'fix/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux-amd64:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      CGO_ENABLED: '1'
      GOFLAGS: -buildvcs=false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
          cache: true
      - name: Resolve locked dependencies
        run: |
          go mod download
          sudo apt-get update && sudo apt-get install -y expect
      - name: Formatting and sFlow-only dependency boundary
        run: |
          test -z "$(gofmt -l $(git ls-files '*.go'))"
          go list -deps ./cmd/vyos-sflow > /tmp/vyos-deps.txt
          if grep -E '/internal/(decode/nf|capture|pcapfile|sandbox|sim|detect|geo|snmp|license)$' /tmp/vyos-deps.txt; then
            echo 'Excluded input implementation is linked into the product'; exit 1
          fi
      - name: Known vulnerabilities in the code and its dependencies
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Vet and Go tests
        run: |
          go vet ./...
          go test -count=1 ./...
          go test -race ./internal/collector ./internal/decode/sflow ./internal/auth ./internal/bootstrap ./internal/settings ./internal/pipeline
      - name: Frontend regression and installer staging tests
        run: |
          node --check internal/web/static/app.js
          node --test internal/web/*.test.cjs
          node tests/vyos_vm_test.cjs
          bash packaging/test-install.sh
          node tests/setup-defaults-test.cjs
          node tests/release-contract.cjs
          node tests/self_installer_test.cjs
          node tests/source-language.cjs --self-test
          node tests/source-language.cjs
          node tests/no-registration.cjs
          node tests/product-boundary.cjs
          node tests/service-lifecycle-test.cjs
          node tests/runtime-helpers-test.cjs
          node tests/installed-service-test.cjs
          node tests/no-restore.cjs
      - name: Build static Linux release candidate
        run: |
          mkdir -p dist/vyos-sflow-1.2.16-linux-amd64 evidence
          static_dir="$(mktemp -d)"
          ln -s "$(g++ -print-file-name=libstdc++.a)" "$static_dir/libstdc++.a"
          export CGO_LDFLAGS="-L$static_dir"
          go build -trimpath -tags netgo,osusergo -ldflags "-s -w -X main.version=1.2.16 -X main.commit=${GITHUB_SHA} -linkmode=external -extldflags '-static -Wl,--wrap=getentropy'" -o dist/vyos-sflow-1.2.16-linux-amd64/vyos-sflow ./cmd/vyos-sflow
          file dist/vyos-sflow-1.2.16-linux-amd64/vyos-sflow
          ldd dist/vyos-sflow-1.2.16-linux-amd64/vyos-sflow 2>&1 | tee evidence/ldd.txt || true
          grep -Eq 'not a dynamic executable|statically linked' evidence/ldd.txt
          dist/vyos-sflow-1.2.16-linux-amd64/vyos-sflow version
      - name: Install browser test runtime
        run: |
          npm install --no-save --ignore-scripts --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Real UDP, DuckDB, HTTP, Chromium and restart acceptance
        run: |
          node tests/tui-session.cjs dist/vyos-sflow-1.2.16-linux-amd64/vyos-sflow
          node tests/e2e.cjs dist/vyos-sflow-1.2.16-linux-amd64/vyos-sflow --browser
          node tests/sampling-lifecycle.cjs dist/vyos-sflow-1.2.16-linux-amd64/vyos-sflow
          node tests/first-login.cjs dist/vyos-sflow-1.2.16-linux-amd64/vyos-sflow
          node tests/first-login-browser.cjs dist/vyos-sflow-1.2.16-linux-amd64/vyos-sflow
          node tests/network-defaults.cjs dist/vyos-sflow-1.2.16-linux-amd64/vyos-sflow
          node tests/browser-no-registration.cjs dist/vyos-sflow-1.2.16-linux-amd64/vyos-sflow
      - name: Package tested binary
        run: |
          target=dist/vyos-sflow-1.2.16-linux-amd64
          cp README.md SECURITY.md LICENSE NOTICE TRADEMARKS.md THIRD_PARTY_NOTICES.md upstream-manifest.json "$target/"
          cp -r packaging docs "$target/"
          tar -C dist --owner=0 --group=0 --numeric-owner -czf dist/vyos-sflow-1.2.16-linux-amd64.tar.gz vyos-sflow-1.2.16-linux-amd64
          tar -tvzf dist/vyos-sflow-1.2.16-linux-amd64.tar.gz | awk '$2 != "0/0" {print "unexpected archive owner: " $0; bad=1} END {exit bad}'
          bash scripts/build-self-installer.sh --archive dist/vyos-sflow-1.2.16-linux-amd64.tar.gz --output dist/vyos-sflow-1.2.16-linux-amd64.run
          bash dist/vyos-sflow-1.2.16-linux-amd64.run --check
          # software bill of materials: the Go modules linked into the binary,
          # DuckDB's bindings among them, with their versions
          GOFLAGS="-buildvcs=false -tags=netgo,osusergo" go run github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.12.0 app -json -licenses=false -main cmd/vyos-sflow -output dist/vyos-sflow-1.2.16-linux-amd64.cdx.json .
          cd dist
          sha256sum vyos-sflow-1.2.16-linux-amd64.tar.gz vyos-sflow-1.2.16-linux-amd64.run vyos-sflow-1.2.16-linux-amd64.cdx.json > SHA256SUMS
      - name: Upgrade from the latest release
        # The newest published release collects into a data directory; this
        # build must open it with every record, store more and keep it all.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prev=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          mkdir -p "$RUNNER_TEMP/prev"
          gh release download "$prev" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/prev" --pattern '*.tar.gz' --pattern SHA256SUMS
          (cd "$RUNNER_TEMP/prev" && sha256sum --ignore-missing -c SHA256SUMS && tar -xzf ./*.tar.gz)
          node tests/upgrade-data.cjs "$RUNNER_TEMP"/prev/vyos-sflow-*-linux-amd64/vyos-sflow dist/vyos-sflow-1.2.16-linux-amd64/vyos-sflow
      - name: Packaged beginner quick start
        run: node tests/quick-start.cjs dist/vyos-sflow-1.2.16-linux-amd64.tar.gz dist/SHA256SUMS
      - name: Real single-file installation and systemd acceptance
        run: sudo --preserve-env=GITHUB_ACTIONS,RUNNER_TEMP node tests/installed-service.cjs --installer dist/vyos-sflow-1.2.16-linux-amd64.run --binary dist/vyos-sflow-1.2.16-linux-amd64/vyos-sflow
      - uses: actions/upload-artifact@v7
        with:
          name: vyos-sflow-1.2.16-linux-amd64
          path: |
            dist/*.tar.gz
            dist/*.run
            dist/*.cdx.json
            dist/SHA256SUMS
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: acceptance-evidence
          path: evidence/
          if-no-files-found: ignore
  vyos-native:
    needs: linux-amd64
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
      - uses: actions/download-artifact@v8
        with:
          name: vyos-sflow-1.2.16-linux-amd64
          path: dist
      - name: Verify tested artifact
        run: cd dist && sha256sum -c SHA256SUMS
      - name: Install isolated VM runtime
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 p7zip-full expect
      - name: Native VyOS live-ISO acceptance
        timeout-minutes: 35
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node tests/vyos_vm.cjs \
            --artifact dist/vyos-sflow-1.2.16-linux-amd64.run \
            --work-dir "$RUNNER_TEMP" --evidence evidence/vyos-vm \
            --timeout 1800
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: vyos-native-vm-evidence
          path: evidence/vyos-vm/
          if-no-files-found: error
  release:
    # a push to main publishes the newest CHANGELOG.md version once, as a
    # release with the files tested above; a pushed version tag does the same
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [linux-amd64, vyos-native]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write # Sigstore signs SHA256SUMS with this workflow's identity
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - name: Version and release notes
        id: v
        run: |
          v=$(sed -n 's/^## \([0-9][0-9.]*\)[[:space:]]*$/\1/p' CHANGELOG.md | head -1)
          if [[ "$GITHUB_REF" == refs/tags/* && "${GITHUB_REF_NAME#v}" != "$v" ]]; then echo "::error::tag $GITHUB_REF_NAME is not the newest CHANGELOG.md version $v"; exit 1; fi
          if gh release view "v$v" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "v$v is already released"; echo "new=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          awk -v h="## $v" '$0==h{on=1;next} /^## /{if(on)exit} on' CHANGELOG.md > notes.md
          echo "ver=$v" >> "$GITHUB_OUTPUT"; echo "new=true" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v8
        if: steps.v.outputs.new == 'true'
        with:
          name: vyos-sflow-1.2.16-linux-amd64
          path: dist
      - uses: sigstore/cosign-installer@v3
        if: steps.v.outputs.new == 'true'
        with:
          cosign-release: v2.6.5
      - name: Sign the checksums
        # Keyless: the signature names this workflow and commit, so a
        # SHA256SUMS changed or uploaded by anyone else (a stolen account
        # included) does not verify. Checked here before anything is published.
        if: steps.v.outputs.new == 'true'
        run: |
          (cd dist && sha256sum -c SHA256SUMS)
          cosign sign-blob --yes --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS
          cosign verify-blob --bundle dist/SHA256SUMS.sigstore.json \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/\.github/workflows/ci\.yml@refs/(heads/main|tags/v.*)$" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com dist/SHA256SUMS
      - name: Publish
        if: steps.v.outputs.new == 'true'
        run: |
          v=${{ steps.v.outputs.ver }}
          test -f "dist/vyos-sflow-$v-linux-amd64.run" || { echo "::error::built files are not version $v"; ls dist; exit 1; }
          (cd dist && sha256sum -c SHA256SUMS)
          gh release create "v$v" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "vyos-sflow $v" --notes-file notes.md \
            dist/*.tar.gz dist/*.run dist/*.cdx.json dist/SHA256SUMS dist/SHA256SUMS.sigstore.json
