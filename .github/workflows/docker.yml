# Single-arch (linux/amd64) image → Docker Hub + GHCR.
# 需要：仓库 Variables 里设 DOCKERHUB_USER；Secrets 里设 DOCKERHUB_TOKEN（Docker Hub Access Token, Read & Write）
# PR 只构建不推送，用来验证 Dockerfile。
name: docker

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - go.mod
      - go.sum
      - .github/workflows/docker.yml
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # 推 GHCR 用
    env:
      PUSH: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # The binary's version has no leading "v" (see cmd/vyos-sflow/startup.go
      # and the release build in ci.yml), so strip it from the tag name.
      - id: ver
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev" >> "$GITHUB_OUTPUT"
          fi

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: |
            docker.io/${{ vars.DOCKERHUB_USER || 'githubflyideas' }}/vyos-sflow
            ghcr.io/${{ github.repository_owner }}/vyos-sflow
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=pr

      # Smoke amd64 (same VERSION as the later push) before publishing, so a
      # broken image is not pushed. The push build reuses the GHA cache.
      - name: Build amd64 image for smoke
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: vyos-sflow:smoke
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
            COMMIT=${{ github.sha }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: smoke test (amd64)
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          cleanup() { docker rm -f vs >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run --rm vyos-sflow:smoke version | grep -F "vyos-sflow ${VERSION} " >/dev/null || {
            echo "::error::version output does not carry ${VERSION}"; exit 1
          }
          docker run -d --name vs -p 8066:8066 -p 6343:6343/udp \
            -v vs-data:/data \
            vyos-sflow:smoke
          ok=0
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8066/healthz; then
              ok=1
              break
            fi
            sleep 1
          done
          test "$ok" = 1
          health=$(curl -fsS http://127.0.0.1:8066/healthz)
          echo "$health"
          echo "$health" | grep -F '"status":"ok"' >/dev/null || {
            echo "::error::healthz is not ok: ${health}"; exit 1
          }
          echo "$health" | grep -F "\"version\":\"${VERSION}\"" >/dev/null || {
            echo "::error::version is not ${VERSION}: ${health}"; exit 1
          }
          docker logs vs

      - if: env.PUSH == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ vars.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - if: env.PUSH == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
            COMMIT=${{ github.sha }}
          provenance: false   # 避免部分平台（如 RouterOS）解析 manifest 时遇到 attestation 条目
          cache-from: type=gha
          cache-to: type=gha,mode=max
