# 临时：只验证 Docker Hub 登录（DOCKERHUB_USER / DOCKERHUB_TOKEN），不构建、不推镜像。验证后删除。
name: docker-login-check
on:
  push:
    branches: [claude/vyos-coffee-knife-opwai9]
    paths: [.github/workflows/docker-login-check.yml]
jobs:
  login:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Variables present
        env:
          U: ${{ vars.DOCKERHUB_USER }}
          T: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          echo "DOCKERHUB_USER=${U:-<empty>}"
          test -n "$U" || { echo "::error::DOCKERHUB_USER variable is not set"; exit 1; }
          test -n "$T" || { echo "::error::DOCKERHUB_TOKEN secret is not set"; exit 1; }
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ vars.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Logged in
        run: echo "Docker Hub login OK as ${{ vars.DOCKERHUB_USER }}"
