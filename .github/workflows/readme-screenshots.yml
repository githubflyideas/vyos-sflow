name: readme-screenshots
on:
  workflow_dispatch:
  push:
    branches: [docs/runtime-screenshots]
    paths: [tests/capture-readme.cjs, .github/workflows/readme-screenshots.yml]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Download verified published executable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.2.15 --repo "$GITHUB_REPOSITORY" --dir dist --pattern '*.tar.gz' --pattern SHA256SUMS
          cd dist
          sha256sum --ignore-missing -c SHA256SUMS
          tar -xzf vyos-sflow-1.2.15-linux-amd64.tar.gz
      - name: Install real browser and terminal runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xterm xdotool imagemagick fonts-dejavu-core
          npm install --no-save --ignore-scripts --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Capture real release screens with synthetic sFlow
        run: xvfb-run -a -s '-screen 0 1600x1000x24' node tests/capture-readme.cjs dist/vyos-sflow-1.2.15-linux-amd64/vyos-sflow evidence/readme-screenshots
      - uses: actions/upload-artifact@v4
        with:
          name: readme-screenshots-v1.2.15
          path: evidence/readme-screenshots/
          if-no-files-found: error
